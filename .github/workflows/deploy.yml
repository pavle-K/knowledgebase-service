name: deploy

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: knowledgebase-service
  TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
  TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
  TF_VAR_github_webhook_secret: ${{ secrets.GH_WEBHOOK_SECRET }}
  TF_VAR_database_url_rw: ${{ secrets.DATABASE_URL_RW }}
  TF_VAR_database_url_ro: ${{ secrets.DATABASE_URL_RO }}
  TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
  TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
  TF_VAR_api_auth_key: ${{ secrets.API_AUTH_KEY }}
  TF_VAR_embedding_provider: ${{ vars.EMBEDDING_PROVIDER }}
  TF_VAR_llm_model: ${{ vars.LLM_MODEL }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Restore Terraform state
        uses: actions/cache@v4
        with:
          path: infra/terraform.tfstate
          # No remote backend yet - this cache is a deliberate stopgap so CI
          # applies aren't starting from a blank state every run. It has no
          # locking and can be evicted; fine for a personal project, not a
          # substitute for a real backend once this needs to be robust.
          key: tfstate-${{ env.AWS_REGION }}

      - name: Terraform init
        working-directory: infra
        run: terraform init

      - name: Create ECR repository (idempotent)
        working-directory: infra
        run: terraform apply -auto-approve -target=aws_ecr_repository.app

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$TF_VAR_image_tag" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$TF_VAR_image_tag"

      - name: Terraform apply
        working-directory: infra
        run: terraform apply -auto-approve

      - name: Get API Gateway URL
        id: tf-output
        working-directory: infra
        run: echo "url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test /healthz
        run: |
          url="${{ steps.tf-output.outputs.url }}/healthz"
          for i in $(seq 1 10); do
            if curl -sf "$url"; then
              echo "healthz OK"
              exit 0
            fi
            sleep 5
          done
          echo "smoke test failed: $url did not return 200" >&2
          exit 1
