name: deploy

on:
  workflow_run:
    workflows: ["test"]
    types: [completed]
    branches: [main]

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: knowledgebase-service
  TF_VAR_image_tag: ${{ github.event.workflow_run.head_sha }}
  TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
  TF_VAR_github_webhook_secret: ${{ secrets.GH_WEBHOOK_SECRET }}
  TF_VAR_database_url_rw: ${{ secrets.DATABASE_URL_RW }}
  TF_VAR_database_url_ro: ${{ secrets.DATABASE_URL_RO }}
  TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
  TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
  TF_VAR_api_auth_key: ${{ secrets.API_AUTH_KEY }}
  TF_VAR_embedding_provider: ${{ vars.EMBEDDING_PROVIDER }}
  TF_VAR_llm_model: ${{ vars.LLM_MODEL }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: List non-fork repos for webhook coverage
        id: webhook_repos
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          repos=$(gh repo list --limit 200 --json name,isFork --jq '[.[] | select(.isFork == false) | .name]')
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Ensure remote state backend exists (bootstrap)
        id: bootstrap
        working-directory: infra/bootstrap
        run: |
          terraform init
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="${ECR_REPOSITORY}-tfstate-${ACCOUNT_ID}"
          TABLE="${ECR_REPOSITORY}-tfstate-lock"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            echo "backend resources already exist - importing into this run's (local, ephemeral) state"
            terraform import aws_s3_bucket.tfstate "$BUCKET"
            terraform import aws_s3_bucket_versioning.tfstate "$BUCKET"
            terraform import aws_s3_bucket_server_side_encryption_configuration.tfstate "$BUCKET"
            terraform import aws_s3_bucket_public_access_block.tfstate "$BUCKET"
            terraform import aws_dynamodb_table.lock "$TABLE"
          else
            echo "backend resources do not exist yet - creating"
          fi
          terraform apply -auto-approve
          echo "bucket=$(terraform output -raw bucket_name)" >> "$GITHUB_OUTPUT"
          echo "table=$(terraform output -raw table_name)" >> "$GITHUB_OUTPUT"

      - name: Terraform init
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ steps.bootstrap.outputs.bucket }}" \
            -backend-config="key=${ECR_REPOSITORY}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${{ steps.bootstrap.outputs.table }}"

      - name: Ensure ECR repository is created and in state
        working-directory: infra
        run: |
          if terraform state show aws_ecr_repository.app >/dev/null 2>&1; then
            echo "already tracked in state"
          elif aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" >/dev/null 2>&1; then
            echo "exists in AWS but not in state (e.g. cache miss on a repeat run) - importing"
            terraform import aws_ecr_repository.app "$ECR_REPOSITORY"
          else
            echo "does not exist yet - creating"
            terraform apply -auto-approve -target=aws_ecr_repository.app
          fi

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$TF_VAR_image_tag" .
          docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$TF_VAR_image_tag"

      - name: Terraform apply
        working-directory: infra
        env:
          TF_VAR_github_webhook_repos: ${{ steps.webhook_repos.outputs.repos }}
        run: terraform apply -auto-approve

      - name: Get API Gateway URL
        id: tf-output
        working-directory: infra
        run: echo "url=$(terraform output -raw api_gateway_url)" >> "$GITHUB_OUTPUT"

      - name: Smoke test /healthz
        run: |
          url="${{ steps.tf-output.outputs.url }}/healthz"
          for i in $(seq 1 10); do
            if curl -sf "$url"; then
              echo "healthz OK"
              exit 0
            fi
            sleep 5
          done
          echo "smoke test failed: $url did not return 200" >&2
          exit 1
