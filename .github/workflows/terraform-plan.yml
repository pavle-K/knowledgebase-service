name: terraform-plan

on:
  pull_request:
    paths:
      - "infra/**"

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: knowledgebase-service
  TF_VAR_image_tag: ${{ github.event.pull_request.head.sha }}
  TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
  TF_VAR_github_webhook_secret: ${{ secrets.GH_WEBHOOK_SECRET }}
  TF_VAR_database_url_rw: ${{ secrets.DATABASE_URL_RW }}
  TF_VAR_database_url_ro: ${{ secrets.DATABASE_URL_RO }}
  TF_VAR_anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
  TF_VAR_openai_api_key: ${{ secrets.OPENAI_API_KEY }}
  TF_VAR_api_auth_key: ${{ secrets.API_AUTH_KEY }}
  TF_VAR_embedding_provider: ${{ vars.EMBEDDING_PROVIDER }}
  TF_VAR_llm_model: ${{ vars.LLM_MODEL }}

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: List non-fork repos for webhook coverage
        id: webhook_repos
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          repos=$(gh repo list --limit 200 --json name,isFork --jq '[.[] | select(.isFork == false) | .name]')
          count=$(echo "$repos" | jq 'length')
          # Terraform destroys the webhook for any repo missing from this list - a
          # short/empty result (rate limit, transient API error) must not reach
          # apply, or it silently deletes webhooks on every other repo.
          if [ "$count" -lt 5 ]; then
            echo "gh repo list returned only $count non-fork repos ($repos) - refusing to continue, this would destroy webhooks on the rest" >&2
            exit 1
          fi
          echo "repos=$repos" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: infra
        run: |
          # Assumes the bootstrap resources (infra/bootstrap/) already exist,
          # created by a prior deploy run - a PR plan is read-only in spirit
          # and shouldn't be the thing that first provisions shared state
          # infra. If no deploy has ever run yet, this fails with a clear
          # "bucket does not exist" error until one does.
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          terraform init \
            -backend-config="bucket=${ECR_REPOSITORY}-tfstate-${ACCOUNT_ID}" \
            -backend-config="key=${ECR_REPOSITORY}/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="dynamodb_table=${ECR_REPOSITORY}-tfstate-lock"

      - name: Terraform plan
        id: plan
        working-directory: infra
        env:
          TF_VAR_github_webhook_repos: ${{ steps.webhook_repos.outputs.repos }}
        run: terraform plan -no-color -input=false | tee plan_output.txt
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('infra/plan_output.txt', 'utf8');
            const truncated = plan.length > 60000 ? plan.slice(-60000) : plan;
            const body = `#### Terraform Plan\n<details><summary>Show plan</summary>\n\n\`\`\`\n${truncated}\n\`\`\`\n\n</details>`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
